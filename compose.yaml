services:
  order-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
#    ports:
#      - "5432:5432"
    volumes:
      - order-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orderdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    secrets:
      - db_password

  inventory-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inventorydb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
#    ports:
#      - "5433:5432"
    volumes:
      - inventory-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventorydb"]
      interval: 5s
      timeout: 5s
      retries: 10
    secrets:
      - db_password

  inventory-service:
    build:
      context: .
      dockerfile: foodflow/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://inventory-db:5432/inventorydb
      DB_USER: postgres
      DB_PASSWORD_FILE: /run/secrets/db_password
      PORT: 8081
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      LOGGING_STRUCTURED_ECS_SERVICE_ENVIRONMENT: local-docker
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:9002/actuator/health > /dev/null || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    ports:
      - "8081:8081"
      - "9002:9002"
    depends_on:
      inventory-db:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_healthy
    secrets:
      - db_password

  order-service:
    build:
      context: .
      dockerfile: foodfloworders/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://order-db:5432/orderdb
      DB_USER: postgres
      DB_PASSWORD_FILE: /run/secrets/db_password
      PORT: 8080
      INVENTORY_BASE_URL: http://inventory-service:8081
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      LOGGING_STRUCTURED_ECS_SERVICE_ENVIRONMENT: local-docker
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:9001/actuator/health > /dev/null || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    ports:
      - "8080:8080"
      - "9001:9001"
    depends_on:
      order-db:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_healthy
    secrets:
      - db_password

  kafka:
    image: apache/kafka:4.3.0
    container_name: kafka
#    ports:
#      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'

      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://localhost:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  redis:
    image: redis:7-alpine
#    ports:
#      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.13.1
#    ports:
#      - "9090:9090"
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:13.1.1
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  order-postgres-data:
  inventory-postgres-data:
  prometheus-data:
  grafana-data:

secrets:
  db_password:
    file: ./db_password.txt
