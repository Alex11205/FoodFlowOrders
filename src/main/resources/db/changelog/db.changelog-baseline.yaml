databaseChangeLog:
  - changeSet:
      id: 001-create-inventory
      author: alex
      changes:
        - createTable:
            tableName: inventory
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_inventory_id
              - column:
                  name: food_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_inventory_food_name
              - column:
                  name: available_quantity
                  type: INTEGER
                  constraints:
                    nullable: false


