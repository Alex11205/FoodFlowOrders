spring.application.name=foodfloworders

spring.config.import=optional:file:./secret.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/orderdb}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml
spring.jpa.show-sql=true

server.port=${PORT:8080}

inventory.base-url=${INVENTORY_BASE_URL:http://localhost:8081}