name: Backend CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven Wrapper Executable
        run: chmod +x ./foodflow/mvnw ./foodfloworders/mvnw

      - name: Build and Test
        run: mvn clean verify
  deploy-images:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ca-central-1
      ECR_REGISTRY: 409154940129.dkr.ecr.ca-central-1.amazonaws.com

    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::409154940129:role/GitHubFoodFlowEcrPushRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2.1.6

      - name: Build and push images
        run: |
          docker build -f foodfloworders/Dockerfile \
            -t "$ECR_REGISTRY/foodflow-order:$GITHUB_SHA" .

          docker build -f foodflow/Dockerfile \
            -t "$ECR_REGISTRY/foodflow-inventory:$GITHUB_SHA" .

          docker push "$ECR_REGISTRY/foodflow-order:$GITHUB_SHA"
          docker push "$ECR_REGISTRY/foodflow-inventory:$GITHUB_SHA"